# conda / mamba alternative to apt:
#   mamba env create -f environment.yml && conda activate variant-ml
name: variant-ml
channels: [conda-forge, bioconda]
dependencies:
  - python=3.12
  - numpy>=1.26
  - pandas>=2.1
  - scikit-learn>=1.4
  - matplotlib>=3.8
  - joblib>=1.3
  - bwa=0.7.18
  - samtools=1.21
  - bcftools=1.21
  - curl
