# CI: simulates the cohort, trains the models and checks them on held-out
# isolates on a fresh Ubuntu machine on every push to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:          # "Run workflow" button in the Actions tab

permissions:
  contents: read

jobs:
  train-and-evaluate:
    name: "simulate cohort → call → features → train → filter VCFs"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      THREADS: 4
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install bioinformatics tools (apt)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bwa samtools bcftools tabix

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Run the pipeline
        run: bash run_all.sh

      - name: Acceptance tests (model must beat the hard filter on held-out isolates)
        run: bash tests/check_outputs.sh

      - name: Publish summary to the job page
        if: always()
        run: cat results/summary.md >> "${GITHUB_STEP_SUMMARY}" || true

      - name: Upload model, metrics and plots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: variant-ml-filter-results
          path: |
            results/03_features/features.tsv
            results/04_models/
            results/05_filtered_vcfs/
            results/summary.md
          retention-days: 14
